<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celestial Arcana — Interactive Tarot Sanctuary</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-obsidian: #08070f;
      --bg-velvet: #100d1f;
      --bg-indigo: #17122e;
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dim: #8a6d1b;
      --crimson-jewel: #7a1c38;
      --emerald-jewel: #134e4a;
      --sapphire-jewel: #1e3a8a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-obsidian);
      background-image:
        radial-gradient(circle at 50% 15%, rgba(49, 34, 92, 0.45) 0%, rgba(16, 13, 31, 0.85) 50%, rgba(8, 7, 15, 1) 100%),
        repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.015) 0px, rgba(212, 175, 55, 0.015) 1px, transparent 1px, transparent 12px);
      color: #f4efe6;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }

    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-decorative { font-family: 'Cinzel Decorative', serif; }
    .font-cormorant { font-family: 'Cormorant Garamond', serif; }

    /* Gold Foil Text Gradient */
    .gold-text {
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 35%, #b38728 65%, #fbf5b7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 16px rgba(212, 175, 55, 0.18);
    }

    /* Ornate Velvet Panel */
    .velvet-panel {
      background: linear-gradient(165deg, rgba(24, 19, 46, 0.92) 0%, rgba(12, 10, 24, 0.96) 100%);
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.75),
        inset 0 0 30px rgba(212, 175, 55, 0.06);
      backdrop-filter: blur(12px);
    }

    /* Gold Leaf Button */
    .btn-gold {
      background: linear-gradient(135deg, #2a2110 0%, #443314 50%, #261d0e 100%);
      border: 1px solid rgba(212, 175, 55, 0.65);
      color: #f3e5ab;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.18), inset 0 1px 0 rgba(255, 245, 200, 0.25);
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .btn-gold:hover:not(:disabled) {
      border-color: #f3e5ab;
      box-shadow: 0 6px 28px rgba(212, 175, 55, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      background: linear-gradient(135deg, #3a2d15 0%, #5e471b 50%, #362912 100%);
    }
    .btn-gold:active:not(:disabled) {
      transform: translateY(0px) scale(0.98);
    }
    .btn-gold:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Pill / Chip Styling */
    .mystic-chip {
      background: rgba(20, 16, 38, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.25);
      color: #d6cfc2;
      transition: all 0.22s ease;
    }
    .mystic-chip:hover {
      border-color: rgba(212, 175, 55, 0.65);
      background: rgba(38, 30, 68, 0.85);
      color: #fff8e7;
    }
    .mystic-chip.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.24) 0%, rgba(138, 109, 27, 0.16) 100%);
      border-color: #d4af37;
      color: #f3e5ab;
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.22);
    }

    /* 3D Tarot Card Flip Mechanics */
    .tarot-perspective {
      perspective: 1400px;
    }
    .tarot-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.85s cubic-bezier(0.34, 1.36, 0.64, 1);
      transform-style: preserve-3d;
    }
    .tarot-card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .tarot-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px;
      overflow: hidden;
    }
    .tarot-front {
      transform: rotateY(180deg);
    }

    /* Card Back Intricate Pattern */
    .card-back-art {
      background: radial-gradient(circle at 50% 50%, #24194a 0%, #120d26 70%, #090614 100%);
      border: 1.5px solid #d4af37;
      box-shadow: inset 0 0 0 4px #110c24, inset 0 0 0 5px rgba(212, 175, 55, 0.55);
    }

    /* Shuffle Riffle Animations */
    @keyframes riffleLeft {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      35% { transform: translateX(-52px) rotate(-11deg) translateY(-6px); }
      65% { transform: translateX(12px) rotate(3deg); }
    }
    @keyframes riffleRight {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      35% { transform: translateX(52px) rotate(11deg) translateY(-6px); }
      65% { transform: translateX(-12px) rotate(-3deg); }
    }
    @keyframes cutDeckAnim {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateX(46px) translateY(-18px) rotate(6deg); }
      75% { transform: translateX(-20px) translateY(6px) rotate(-2deg); }
    }
    .anim-riffle-left { animation: riffleLeft 0.65s cubic-bezier(0.45, 0.05, 0.55, 0.95); }
    .anim-riffle-right { animation: riffleRight 0.65s cubic-bezier(0.45, 0.05, 0.55, 0.95); }
    .anim-cut { animation: cutDeckAnim 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

    /* Fan Card Hover & Pull */
    .fan-card-wrapper {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform-origin: 50% 250px;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), filter 0.25s ease, opacity 0.3s ease;
      cursor: pointer;
    }
    @media (min-width: 640px) {
      .fan-card-wrapper {
        transform-origin: 50% 295px;
      }
    }
    .fan-card-wrapper:hover {
      z-index: 90 !important;
      filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.75));
    }
    .fan-card-wrapper.pulled {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(-100px) scale(0.7) !important;
    }

    /* Active Slot Glow */
    .slot-selected {
      box-shadow: 0 0 0 2px #f3e5ab, 0 0 24px rgba(212, 175, 55, 0.55) !important;
      transform: translateY(-4px) scale(1.03);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(12, 10, 24, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.35); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(212, 175, 55, 0.65); }

    /* Particle Canvas */
    #starlight-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body class="antialiased selection:bg-amber-500/30 selection:text-amber-200">
  <!-- Ambient Floating Dust & Starlight -->
  <canvas id="starlight-canvas"></canvas>

  <!-- Main App Container (Compact Chat-Feed & Iframe Responsive) -->
  <div class="relative z-10 max-w-3xl mx-auto px-3 sm:px-5 py-3 sm:py-4 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="flex items-center justify-between gap-2 pb-3 border-b border-amber-500/20">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-8 h-8 sm:w-9 sm:h-9 shrink-0 rounded-full border border-amber-400/50 bg-amber-500/10 flex items-center justify-center shadow-inner">
          <svg class="w-4 h-4 sm:w-5 sm:h-5 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2L14.8 9.2L22 12L14.8 14.8L12 22L9.2 14.8L2 12L9.2 9.2L12 2Z" />
            <circle cx="12" cy="12" r="2.5" />
          </svg>
        </div>
        <div class="truncate">
          <h1 class="font-decorative text-base sm:text-xl tracking-wider gold-text font-bold truncate">CELESTIAL ARCANA</h1>
          <p class="text-[10px] sm:text-xs text-amber-200/60 tracking-widest uppercase truncate">78-Card Tarot Sanctuary</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button id="sound-toggle" type="button" title="Toggle Ambient Chimes" class="mystic-chip px-2.5 py-1.5 rounded-full text-[11px] sm:text-xs flex items-center gap-1">
          <span id="sound-icon">✦</span>
          <span id="sound-label">Chimes: On</span>
        </button>
        <button id="reset-btn" type="button" class="mystic-chip px-3 py-1.5 rounded-full text-[11px] sm:text-xs font-medium flex items-center gap-1 hidden">
          <span>↺</span>
          <span>New</span>
        </button>
      </div>
    </header>

    <!-- STEP 1: INTENTION & SPREAD SANCTUM -->
    <section id="setup-stage" class="my-auto py-3 sm:py-5 transition-all duration-500">
      <div class="velvet-panel rounded-2xl p-4 sm:p-6 max-w-2xl mx-auto relative overflow-hidden">
        <!-- Corner Filigree Accents -->
        <div class="absolute top-2.5 left-2.5 w-4 h-4 border-t border-l border-amber-400/40 rounded-tl-md pointer-events-none"></div>
        <div class="absolute top-2.5 right-2.5 w-4 h-4 border-t border-r border-amber-400/40 rounded-tr-md pointer-events-none"></div>
        <div class="absolute bottom-2.5 left-2.5 w-4 h-4 border-b border-l border-amber-400/40 rounded-bl-md pointer-events-none"></div>
        <div class="absolute bottom-2.5 right-2.5 w-4 h-4 border-b border-r border-amber-400/40 rounded-br-md pointer-events-none"></div>

        <div class="text-center mb-4">
          <span class="inline-block text-[10px] uppercase tracking-[0.25em] text-amber-300/80 mb-1">Step I • Set Your Intention</span>
          <h2 class="font-cinzel text-xl sm:text-2xl text-amber-50 font-semibold">Consult the Velvet Table</h2>
          <p class="font-cormorant italic text-base text-stone-300/85 mt-0.5">Focus upon a question, or choose an energetic realm to illuminate.</p>
        </div>

        <!-- Focus Realm Pills -->
        <div class="mb-3.5">
          <label class="block text-[10px] uppercase tracking-widest text-amber-200/70 mb-1.5">Realm of Inquiry</label>
          <div id="focus-pills" class="grid grid-cols-2 sm:grid-cols-4 gap-1.5">
            <button type="button" data-focus="General Energy" class="mystic-chip active rounded-xl py-2 px-2.5 text-xs font-medium text-center">✧ General Energy</button>
            <button type="button" data-focus="Career & Craft" class="mystic-chip rounded-xl py-2 px-2.5 text-xs font-medium text-center">⚔ Career & Craft</button>
            <button type="button" data-focus="Love & Bonds" class="mystic-chip rounded-xl py-2 px-2.5 text-xs font-medium text-center">♥ Love & Bonds</button>
            <button type="button" data-focus="Crossroads" class="mystic-chip rounded-xl py-2 px-2.5 text-xs font-medium text-center">☽ Crossroads</button>
          </div>
        </div>

        <!-- Custom Question Input -->
        <div class="mb-4">
          <label for="user-question" class="block text-[10px] uppercase tracking-widest text-amber-200/70 mb-1.5">Your Whispered Question <span class="text-stone-400 normal-case tracking-normal">(Optional)</span></label>
          <input
            id="user-question"
            type="text"
            maxlength="140"
            placeholder="e.g., What energy surrounds my next creative chapter?"
            class="w-full rounded-xl bg-[#0b0917]/90 border border-amber-500/30 focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-500/20 px-3.5 py-2.5 text-xs sm:text-sm text-amber-50 placeholder-stone-500 transition"
          />
        </div>

        <!-- Spread Selection -->
        <div class="mb-5">
          <label class="block text-[10px] uppercase tracking-widest text-amber-200/70 mb-1.5">Choose Your Spread</label>
          <div id="spread-options" class="grid grid-cols-1 sm:grid-cols-3 gap-2">
            <button type="button" data-spread="single" class="mystic-chip rounded-xl p-3 text-left flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-0.5">
                  <span class="font-cinzel font-semibold text-xs sm:text-sm text-amber-200">Single Oracle</span>
                  <span class="text-[11px] text-amber-400/80">1 Card</span>
                </div>
                <p class="text-[11px] text-stone-400 leading-snug">Direct mirror of your immediate truth.</p>
              </div>
              <div class="mt-2 flex gap-1">
                <span class="w-3.5 h-5 rounded-sm border border-amber-400/60 bg-amber-400/15"></span>
              </div>
            </button>

            <button type="button" data-spread="ppf" class="mystic-chip active rounded-xl p-3 text-left flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-0.5">
                  <span class="font-cinzel font-semibold text-xs sm:text-sm text-amber-200">Temporal Triad</span>
                  <span class="text-[11px] text-amber-400/80">3 Cards</span>
                </div>
                <p class="text-[11px] text-stone-400 leading-snug">Past roots, Present currents & Future.</p>
              </div>
              <div class="mt-2 flex gap-1">
                <span class="w-3.5 h-5 rounded-sm border border-amber-400/60 bg-amber-400/15"></span>
                <span class="w-3.5 h-5 rounded-sm border border-amber-400/60 bg-amber-400/15"></span>
                <span class="w-3.5 h-5 rounded-sm border border-amber-400/60 bg-amber-400/15"></span>
              </div>
            </button>

            <button type="button" data-spread="soa" class="mystic-chip rounded-xl p-3 text-left flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-0.5">
                  <span class="font-cinzel font-semibold text-xs sm:text-sm text-amber-200">Alchemist's Cross</span>
                  <span class="text-[11px] text-amber-400/80">3 Cards</span>
                </div>
                <p class="text-[11px] text-stone-400 leading-snug">Situation, hidden Obstacle & Advice.</p>
              </div>
              <div class="mt-2 flex gap-1">
                <span class="w-3.5 h-5 rounded-sm border border-amber-400/60 bg-amber-400/15"></span>
                <span class="w-3.5 h-5 rounded-sm border border-amber-400/60 bg-amber-400/15 rotate-90 mx-0.5"></span>
                <span class="w-3.5 h-5 rounded-sm border border-amber-400/60 bg-amber-400/15"></span>
              </div>
            </button>
          </div>
        </div>

        <div class="flex justify-center">
          <button id="begin-ritual-btn" type="button" class="btn-gold rounded-full px-7 py-2.5 font-cinzel text-xs sm:text-sm font-semibold tracking-wider uppercase flex items-center gap-2">
            <span>Enter the Ritual</span>
            <span>→</span>
          </button>
        </div>
      </div>
    </section>

    <!-- STEP 2: SHUFFLE, CUT & FAN STAGE -->
    <section id="ritual-stage" class="hidden flex-1 flex flex-col justify-between py-2.5">
      <!-- Ritual Status Banner -->
      <div class="text-center max-w-lg mx-auto mb-1">
        <p id="active-intention-display" class="font-cormorant italic text-sm sm:text-base text-amber-200/85 truncate"></p>
        <h2 id="ritual-instruction" class="font-cinzel text-base sm:text-xl text-amber-50 font-semibold">Shuffle the 78 Arcana</h2>
        <p id="ritual-subtext" class="text-xs text-stone-400 mt-0.5">Imbue the deck with your energy, then fan the cards to draw.</p>
      </div>

      <!-- Interactive Deck / Fan Arena -->
      <div class="relative flex-1 min-h-[250px] sm:min-h-[285px] flex flex-col items-center justify-center my-1 overflow-hidden">
        <!-- Stacked Deck View (Before Fanning) -->
        <div id="deck-pile-container" class="relative w-28 h-44 sm:w-32 sm:h-52 flex items-center justify-center cursor-pointer select-none" title="Click to Shuffle">
          <div id="deck-card-1" class="absolute inset-0 rounded-xl card-back-art shadow-2xl transform -rotate-3 transition-transform"></div>
          <div id="deck-card-2" class="absolute inset-0 rounded-xl card-back-art shadow-2xl transform rotate-2 transition-transform"></div>
          <div id="deck-card-3" class="absolute inset-0 rounded-xl card-back-art shadow-2xl flex items-center justify-center">
            <div class="w-20 h-32 sm:w-24 sm:h-40 border border-amber-400/40 rounded-lg flex flex-col items-center justify-center p-2 text-center">
              <svg class="w-6 h-6 text-amber-300/80 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4" />
              </svg>
              <span class="font-cinzel text-[8px] tracking-[0.2em] text-amber-200/75 uppercase">78 Arcana</span>
            </div>
          </div>
        </div>

        <!-- Curved Fan View (Hidden until Spread/Fan clicked) -->
        <div id="card-fan-container" class="hidden relative w-full h-[240px] sm:h-[275px] overflow-visible select-none">
          <!-- Cards injected dynamically via JS -->
        </div>
      </div>

      <!-- Ritual Controls & Mini Pull Progress -->
      <div class="flex flex-col items-center gap-2.5 pb-1">
        <!-- Selected Slots Indicator -->
        <div id="pull-progress-slots" class="flex items-center justify-center gap-2.5">
          <!-- Populated dynamically -->
        </div>

        <div id="deck-controls" class="flex flex-wrap items-center justify-center gap-2">
          <button id="shuffle-btn" type="button" class="mystic-chip rounded-full px-4 py-2 text-xs font-cinzel tracking-wider flex items-center gap-1.5">
            <span>✧</span>
            <span>Shuffle</span>
          </button>
          <button id="cut-btn" type="button" class="mystic-chip rounded-full px-4 py-2 text-xs font-cinzel tracking-wider flex items-center gap-1.5">
            <span>◈</span>
            <span>Cut</span>
          </button>
          <button id="fan-btn" type="button" class="btn-gold rounded-full px-5 py-2 text-xs font-cinzel font-semibold tracking-wider flex items-center gap-1.5">
            <span>Spread & Draw</span>
            <span>→</span>
          </button>
        </div>
      </div>
    </section>

    <!-- STEP 3: SPREAD REVEAL & INTERPRETATION SANCTUARY -->
    <section id="reading-stage" class="hidden flex-1 flex flex-col gap-3.5 py-2.5">
      <!-- Top Context & Share Bar -->
      <div class="flex flex-wrap items-center justify-between gap-2 bg-white/[0.02] border border-amber-500/20 rounded-xl px-3.5 py-2.5">
        <div class="min-w-0 flex-1">
          <span id="reading-spread-badge" class="text-[10px] uppercase tracking-[0.2em] text-amber-400 font-semibold block">Temporal Triad</span>
          <p id="reading-question-banner" class="font-cormorant italic text-sm sm:text-base text-stone-200 truncate">Focus: General Energy</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="flip-all-btn" type="button" class="mystic-chip rounded-full px-3.5 py-1.5 text-xs font-cinzel tracking-wider">
            Reveal All
          </button>
          <button id="copy-chat-btn" type="button" class="btn-gold rounded-full px-3.5 py-1.5 text-xs font-cinzel font-semibold tracking-wider flex items-center gap-1.5">
            <span id="copy-chat-icon">📋</span>
            <span id="copy-chat-label">Copy Reading for Chat</span>
          </button>
        </div>
      </div>

      <!-- Cards Stage (Side-by-side even on narrow chat widths) -->
      <div id="spread-cards-grid" class="grid grid-cols-3 gap-2.5 sm:gap-5 items-start justify-items-center py-1">
        <!-- Revealed Tarot Cards injected here -->
      </div>

      <!-- Deep Interpretation & Synthesis Panel -->
      <div class="velvet-panel rounded-2xl p-4 sm:p-5">
        <!-- Navigation Tabs -->
        <div id="reading-tabs" class="flex flex-wrap items-center gap-1.5 border-b border-amber-500/20 pb-3 mb-3.5">
          <!-- Card Tabs + Synthesis Tab injected dynamically -->
        </div>

        <!-- Interpretation Content Area -->
        <div id="interpretation-content" class="max-h-[210px] sm:max-h-[240px] overflow-y-auto pr-1">
          <!-- Dynamic Card or Synthesis Reading -->
        </div>
      </div>
    </section>

  </div>

  <script>
    /**
     * ============================================================================
     * CELESTIAL ARCANA — COMPLETE 78-CARD TAROT ENGINE & PROCEDURAL ARTWORK
     * ============================================================================
     */

    // --- 1. WEB AUDIO API MYSTICAL CHIMES (Zero external audio dependencies) ---
    class MysticAudio {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, duration = 0.55, type = 'sine', gainVal = 0.06, delay = 0) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(gainVal, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.05);
        } catch (e) {
          // Graceful fallback if audio blocked
        }
      }

      playShuffle() {
        [320, 390, 440, 520, 410].forEach((f, i) => {
          this.playTone(f, 0.14, 'triangle', 0.035, i * 0.045);
        });
      }

      playDraw() {
        this.playTone(528, 0.7, 'sine', 0.065, 0);
        this.playTone(792, 0.85, 'sine', 0.035, 0.08);
      }

      playReveal() {
        this.playTone(432, 0.9, 'sine', 0.06, 0);
        this.playTone(648, 1.1, 'sine', 0.045, 0.07);
        this.playTone(864, 1.3, 'triangle', 0.03, 0.14);

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function spreadDeckIntoFan() {
      audio.playDraw();

      ritualSubtext.textContent = `Tap any face-down card in the arc (${state.drawnCards.length} of ${spread.count} chosen)`;

      // Responsive fan tuned to fit comfortably inside narrow chat iframes (340px–720px)
      const containerWidth = cardFanContainer.clientWidth || window.innerWidth;
      const isNarrow = containerWidth < 480;
      const visibleCount = isNarrow ? 22 : 30;
      const totalAngle = isNarrow ? 64 : 82;
      const startAngle = -totalAngle / 2;
      const stepAngle = totalAngle / (visibleCount - 1);

      cardFanContainer.innerHTML = '';

      for (let i = 0; i < visibleCount; i++) {
        const cardData = state.deck[i];
        const angle = startAngle + i * stepAngle;
        const cardEl = document.createElement('div');
        cardEl.className = 'fan-card-wrapper w-14 h-24 sm:w-20 sm:h-32';
        cardEl.style.zIndex = i + 1;
        cardEl.style.transform = `translateX(-50%) rotate(${angle}deg)`;

        cardEl.innerHTML = `
          <div class="w-full h-full rounded-lg card-back-art shadow-xl flex items-center justify-center transition-transform duration-200">

              <span class="text-amber-300/60 text-[10px]">✦</span>
            </div>
          </div>
        `;

        cardEl.addEventListener('mouseenter', () => {
          if (!cardEl.classList.contains('pulled')) {
            cardEl.style.transform = `translateX(-50%) rotate(${angle}deg) translateY(-16px) scale(1.06)`;
          }
        });

        cardEl.addEventListener('mouseleave', () => {
          if (!cardEl.classList.contains('pulled')) {
            cardEl.style.transform = `translateX(-50%) rotate(${angle}deg)`;
          }
        });

        cardEl.addEventListener('click', () => handleCardPull(cardData, cardEl));
        cardFanContainer.appendChild(cardEl);
      }
    }

    function handleCardPull(cardData, cardEl) {
      const spread = SPREADS[state.spreadKey];
      if (state.drawnCards.length >= spread.count) return;
      if (cardEl.classList.contains('pulled')) return;

      audio.playDraw();
      cardEl.classList.add('pulled');

      const isReversed = Math.random() < 0.32; // ~32% natural reversal probability
      state.drawnCards.push({
        card: cardData,
        isReversed,
        slotIndex: state.drawnCards.length,
        revealed: false
      });

      renderPullProgressSlots();

      const remaining = spread.count - state.drawnCards.length;
      if (remaining > 0) {
        ritualSubtext.textContent = `Choose ${remaining} more ${remaining === 1 ? 'card' : 'cards'} from the arc...`;
      } else {
        ritualInstruction.textContent = 'Your Spread is Drawn';
        ritualSubtext.textContent = 'Laying your cards upon the velvet cloth...';
        setTimeout(() => {
          transitionToReadingStage();
        }, 650);
      }
    }

      if (state.question) {

      state.drawnCards.forEach((item, idx) => {

        const desc = item.isReversed ? item.card.reversedDesc : item.card.uprightDesc;
        lines.push(`🃏 **${slot.label}: ${item.card.name}** (${orientation})`);
        lines.push(`   *Themes:* ${keys}`);

        lines.push('');
      });

      const majorCount = state.drawnCards.filter((c) => c.card.suit === 'Major').length;
      const reversedCount = state.drawnCards.filter((c) => c.isReversed).length;
      let takeaway = '';
      if (majorCount === state.drawnCards.length) {

      }
      if (reversedCount > 0) {
        takeaway += ` (${reversedCount} reversed: invites inner reflection & recalibration.)`;
      }

      lines.push(`🌟 **Synthesis:** ${takeaway}`);
      return lines.join('\n');
    }

    function copyTextFallback(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.top = '-9999px';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      let success = false;
      try {
        success = document.execCommand('copy');
      } catch (err) {
        success = false;
      }
      document.body.removeChild(textarea);
      return success;
    }

      if (navigator.clipboard && window.isSecureContext) {

          copied = true;
        } catch (e) {
          copied = copyTextFallback(summary);
        }
      } else {
        copied = copyTextFallback(summary);

      if (copied) {

            </div>

            <div class="flex flex-wrap items-center gap-3">
              <h3 class="font-cinzel text-2xl sm:text-3xl text-amber-50 font-bold">${item.card.name}</h3>
              <span class="text-xs uppercase tracking-widest px-3 py-1 rounded-full ${
                item.isReversed
                  ? 'bg-rose-950/80 text-rose-200 border border-rose-500/40'
                  : 'bg-amber-500/15 text-amber-300 border border-amber-400/40'
              }">
                ${item.isReversed ? 'Reversed Orientation' : 'Upright Orientation'}
              </span>
            </div>

            <!-- Keywords Pills -->
            <div class="flex flex-wrap gap-2 pt-0.5">
              ${keywords
                .map(
                  (kw) =>
                    `<span class="px-3 py-1 rounded-lg text-xs bg-white/[0.04] border border-amber-500/25 text-amber-200/90">${kw}</span>`
                )
                .join('')}
            </div>

            <p class="font-cormorant italic text-lg sm:text-xl text-amber-100/90 leading-snug pt-1">
              ${contextSentence}
            </p>

            <p class="text-sm sm:text-[15px] text-stone-300 leading-relaxed">
              ${coreMeaning}
            </p>
          </div>
        </div>
      `;
    }

    // --- 9. EVENT LISTENERS ---
    focusPills.forEach((btn) => {
      btn.addEventListener('click', () => {
        focusPills.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.focus = btn.dataset.focus;
      });
    });

    spreadOptions.forEach((btn) => {
      btn.addEventListener('click', () => {
        spreadOptions.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.spreadKey = btn.dataset.spread;
      });
    });

    beginRitualBtn.addEventListener('click', () => {
      state.question = questionInput.value.trim();
      state.deck = createShuffledDeck();
      state.drawnCards = [];
      state.isFanned = false;

      setupStage.classList.add('hidden');
      ritualStage.classList.remove('hidden');
      resetBtn.classList.remove('hidden');

      deckPileContainer.classList.remove('hidden');
      deckControls.classList.remove('hidden');
      cardFanContainer.classList.add('hidden');
      flipAllBtn.classList.remove('hidden');

      const spread = SPREADS[state.spreadKey];
      activeIntentionDisplay.textContent = state.question
        ? `“${state.question}” • ${state.focus}`
        : `${state.focus} • ${spread.name}`;
      ritualInstruction.textContent = 'Shuffle & Cut the 78 Arcana';
      ritualSubtext.textContent = 'Click the deck or buttons below to attune the cards, then spread them to draw.';

      renderPullProgressSlots();
      animateDeckShuffle();
    });

    deckPileContainer.addEventListener('click', animateDeckShuffle);
    shuffleBtn.addEventListener('click', animateDeckShuffle);
    cutBtn.addEventListener('click', animateDeckCut);
    fanBtn.addEventListener('click', spreadDeckIntoFan);

    flipAllBtn.addEventListener('click', () => {
      state.drawnCards.forEach((_, idx) => revealCard(idx));
    });

    resetBtn.addEventListener('click', () => {
      readingStage.classList.add('hidden');
      ritualStage.classList.add('hidden');
      setupStage.classList.remove('hidden');
      resetBtn.classList.add('hidden');
      state.drawnCards = [];
      state.isFanned = false;
    });

    soundToggle.addEventListener('click', () => {
      audio.enabled = !audio.enabled;
      soundLabel.textContent = audio.enabled ? 'Chimes: On' : 'Chimes: Off';
      soundToggle.classList.toggle('opacity-60', !audio.enabled);
      if (audio.enabled) audio.playDraw();
    });

    // --- 10. AMBIENT STARLIGHT & FLOATING GOLD DUST PARTICLES ---
    (function initStarlightParticles() {
      const canvas = document.getElementById('starlight-canvas');
      const ctx = canvas.getContext('2d');
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 55 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.6 + 0.4,
        vx: (Math.random() - 0.5) * 0.18,
        vy: -Math.random() * 0.25 - 0.05,
        alpha: Math.random() * 0.65 + 0.15,
        phase: Math.random() * Math.PI * 2
      }));

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.phase += 0.02;

          if (p.y < -10) p.y = height + 10;
          if (p.x < -10) p.x = width + 10;
          if (p.x > width + 10) p.x = -10;

          const twinkle = p.alpha * (0.65 + 0.35 * Math.sin(p.phase));
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(243, 229, 171, ${twinkle})`;
          ctx.fill();
        });
        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>
</body>
